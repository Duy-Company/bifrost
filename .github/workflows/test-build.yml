name: Test builds (no release)
on:
  push:
    branches: ['test/android-lan']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Build Android companion test APK
        run: JAVA_HOME="$JAVA_HOME_17_X64" node scripts/build-android.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-sender-test
          path: dist/test/Bifrost-Sender-test.apk
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run build:receiver
      - run: python3 scripts/prepare-native-test.py
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-test
          compression-level: 0
          path: |
            dist/Bifrost-*-x64.exe
            dist/Bifrost-*-x64.zip
            artifacts/native-test/*
  validate:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-test
      - shell: pwsh
        run: Expand-Archive (Get-ChildItem dist/Bifrost-*-x64.zip | Select-Object -First 1).FullName -DestinationPath packaged
      - run: node scripts/test-windows-receiver.mjs packaged
      - run: node --import tsx scripts/test-windows-png.mjs packaged
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-test-validation
          path: |
            windows-validation.json
            artifacts/windows-png-validation.json
