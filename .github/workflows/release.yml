name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - name: Build native Windows receiver from pinned source
        run: npm run build:receiver
      - name: Package Windows and update feed
        run: npm run dist:win
      - run: node scripts/verify-release.mjs
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
  windows-validation:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release
          path: dist
      - name: Extract packaged application
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist/Bifrost-*-x64.zip | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath packaged
      - name: Verify native Windows app and AirPlay service
        run: node scripts/test-windows-receiver.mjs packaged
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-validation
          path: windows-validation.json
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: windows-validation
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --title "Bifrost $RELEASE_TAG"
          --notes-file RELEASE_NOTES.md
          dist/*.exe dist/*.zip dist/*.blockmap
          dist/latest.yml dist/SHA256SUMS.txt dist/windows-validation.json
